<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manzil — Delivery Tracking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1826; --panel:#152437; --panel2:#1B2E45; --line:#26394F;
  --text:#E7EDF4; --sub:#8FA3BA; --muted:#5D7290;
  --amber:#F0A83E; --blue:#4FC3F7; --green:#34D399; --red:#F0666B;
  --font-head:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font-body);}
body{display:flex;flex-direction:column;min-height:100%;}
h1,h2,h3,.head{font-family:var(--font-head);}
a{color:inherit;}

/* NAV */
nav{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20;padding-top:calc(14px + env(safe-area-inset-top,0px));}
.logo{font-family:var(--font-head);font-weight:700;font-size:1.25rem;letter-spacing:.01em;display:flex;align-items:center;gap:8px;}
.logo .dot{width:9px;height:9px;border-radius:50%;background:var(--amber);}
.nav-right{display:flex;align-items:center;gap:14px;}
.bell-wrap{position:relative;}
.bell{width:38px;height:38px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);}
.badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:.65rem;font-weight:600;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
.notif-panel{position:absolute;right:0;top:46px;width:290px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.4);display:none;overflow:hidden;z-index:30;}
.notif-panel.open{display:block;}
.notif-panel header{padding:12px 14px;border-bottom:1px solid var(--line);font-weight:600;font-size:.85rem;color:var(--sub);}
.notif-item{padding:11px 14px;border-bottom:1px solid var(--line);font-size:.82rem;display:flex;gap:9px;}
.notif-item:last-child{border-bottom:none;}
.notif-dot{width:7px;height:7px;border-radius:50%;background:var(--blue);margin-top:5px;flex-shrink:0;}
.notif-item .t{color:var(--muted);font-size:.72rem;margin-top:2px;}

/* LAYOUT */
main{flex:1;display:grid;grid-template-columns:340px 1fr;gap:0;max-width:1280px;margin:0 auto;width:100%;}
@media (max-width:880px){ main{grid-template-columns:1fr;} }

/* SIDEBAR */
aside{border-right:1px solid var(--line);padding:18px;overflow:auto;}
@media (max-width:880px){ aside{border-right:none;border-bottom:1px solid var(--line);} }
.search{position:relative;margin-bottom:12px;}
.search input{width:100%;padding:10px 12px 10px 34px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:.88rem;font-family:var(--font-body);}
.search input:focus{outline:2px solid var(--blue);outline-offset:1px;}
.search svg{position:absolute;left:11px;top:11px;color:var(--muted);}
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:.78rem;font-family:var(--font-body);flex:1;}
select:focus{outline:2px solid var(--blue);}

.order-card{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;cursor:pointer;transition:border-color .15s;}
.order-card:hover{border-color:var(--muted);}
.order-card.active{border-color:var(--blue);background:var(--panel2);}
.order-card .row1{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
.order-card .oid{font-weight:600;font-size:.85rem;}
.order-card .cust{font-size:.78rem;color:var(--sub);margin-bottom:6px;}
.order-card .route{font-size:.74rem;color:var(--muted);}
.pill{font-size:.66rem;font-weight:600;padding:3px 8px;border-radius:100px;white-space:nowrap;}
.pill.transit{background:rgba(240,168,62,.15);color:var(--amber);}
.pill.pending{background:rgba(79,195,247,.15);color:var(--blue);}
.pill.delivered{background:rgba(52,211,153,.15);color:var(--green);}
.pill.picked{background:rgba(79,195,247,.15);color:var(--blue);}
.empty-note{color:var(--muted);font-size:.82rem;text-align:center;padding:20px 0;}

/* TRACKING PANEL */
.track{padding:22px;}
.track-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.track-head h1{font-size:1.3rem;margin:0 0 4px;}
.track-head .sub{color:var(--sub);font-size:.85rem;}
.eta-box{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 16px;text-align:right;}
.eta-box .label{font-size:.68rem;color:var(--muted);text-transform:lowercase;}
.eta-box .val{font-family:var(--font-head);font-weight:700;font-size:1.2rem;color:var(--amber);}

/* map / route */
.map{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;}
.map svg{width:100%;height:auto;display:block;}
.map-legend{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap;font-size:.75rem;color:var(--sub);}
.map-legend span{display:flex;align-items:center;gap:6px;}
.leg-dot{width:9px;height:9px;border-radius:50%;}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media (max-width:640px){ .grid2{grid-template-columns:1fr;} }

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;}
.card h3{font-size:.9rem;margin:0 0 12px;color:var(--sub);font-weight:600;}

.rider{display:flex;gap:12px;align-items:center;margin-bottom:12px;}
.avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--amber));display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-weight:700;color:#0F1826;flex-shrink:0;}
.rider .name{font-weight:600;font-size:.95rem;}
.rider .veh{font-size:.78rem;color:var(--muted);}
.rider-detail{font-size:.8rem;color:var(--sub);display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line);}
.rider-detail:first-of-type{border-top:none;}

.timeline{list-style:none;margin:0;padding:0;}
.timeline li{display:flex;gap:10px;padding-bottom:14px;position:relative;}
.timeline li:last-child{padding-bottom:0;}
.timeline li::before{content:'';position:absolute;left:5px;top:16px;bottom:0;width:1px;background:var(--line);}
.timeline li:last-child::before{display:none;}
.tl-dot{width:11px;height:11px;border-radius:50%;background:var(--line);margin-top:2px;flex-shrink:0;z-index:1;}
.timeline li.done .tl-dot{background:var(--green);}
.timeline li.current .tl-dot{background:var(--amber);box-shadow:0 0 0 3px rgba(240,168,62,.2);}
.tl-title{font-size:.85rem;font-weight:500;}
.timeline li:not(.done):not(.current) .tl-title{color:var(--muted);}
.tl-time{font-size:.72rem;color:var(--muted);}

.status-line{display:flex;align-items:center;gap:8px;margin-bottom:16px;}
.status-line .pill{font-size:.75rem;padding:5px 12px;}

@media (max-width:880px){ .track{padding:16px;} }
</style>
</head>
<body>

<nav>
  <div class="logo"><span class="dot"></span>Manzil</div>
  <div class="nav-right">
    <div class="bell-wrap">
      <div class="bell" id="bellBtn" role="button" tabindex="0" aria-label="Notifications">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="badge" id="notifBadge">3</span>
      </div>
      <div class="notif-panel" id="notifPanel">
        <header>Notifications</header>
        <div id="notifList"></div>
      </div>
    </div>
  </div>
</nav>

<main>
  <aside>
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" placeholder="Search order ID, customer, rider">
    </div>
    <div class="filters">
      <select id="statusFilter">
        <option value="">All statuses</option>
        <option value="pending">Pending pickup</option>
        <option value="picked">Picked up</option>
        <option value="transit">In transit</option>
        <option value="delivered">Delivered</option>
      </select>
      <select id="dateFilter">
        <option value="">All dates</option>
      </select>
    </div>
    <div id="orderList"></div>
  </aside>

  <section class="track" id="trackPanel"></section>
</main>

<script>
const STATUS_META = {
  pending:  {label:'Pending pickup', cls:'pending'},
  picked:   {label:'Picked up',      cls:'picked'},
  transit:  {label:'In transit',     cls:'transit'},
  delivered:{label:'Delivered',      cls:'delivered'}
};

const orders = [
  {
    id:'ORD-1042', customer:'Hina Yousaf', date:'2026-09-25', status:'transit', eta:'25 minutes',
    pickup:'Mardan', delivery:'Timergara', riderPos:'Chakdara',
    rider:{name:'Bilal Khan', initials:'BK', phone:'+92 333 1122334', vehicle:'Honda CD 70 · Bike · PK-4521'},
    timeline:[
      {t:'New order created', time:'9:02 AM', state:'done'},
      {t:'Rider assigned', time:'9:06 AM', state:'done'},
      {t:'Order accepted', time:'9:08 AM', state:'done'},
      {t:'Order picked up', time:'9:20 AM', state:'done'},
      {t:'Delivery started', time:'9:25 AM', state:'current'},
      {t:'Delivery completed', time:'—', state:''}
    ]
  },
  {
    id:'ORD-1041', customer:'Adeel Raza', date:'2026-09-25', status:'pending', eta:'55 minutes',
    pickup:'Swabi', delivery:'Mardan', riderPos:'Swabi',
    rider:{name:'Junaid Iqbal', initials:'JI', phone:'+92 300 4455667', vehicle:'Suzuki Alto · Car · PK-2290'},
    timeline:[
      {t:'New order created', time:'10:11 AM', state:'done'},
      {t:'Rider assigned', time:'10:14 AM', state:'current'},
      {t:'Order accepted', time:'—', state:''},
      {t:'Order picked up', time:'—', state:''},
      {t:'Delivery started', time:'—', state:''},
      {t:'Delivery completed', time:'—', state:''}
    ]
  },
  {
    id:'ORD-1039', customer:'Sana Tariq', date:'2026-09-24', status:'delivered', eta:'Delivered',
    pickup:'Chakdara', delivery:'Dir', riderPos:'Dir',
    rider:{name:'Usman Ali', initials:'UA', phone:'+92 345 9988776', vehicle:'Yamaha YBR · Bike · PK-8804'},
    timeline:[
      {t:'New order created', time:'Sep 24, 3:40 PM', state:'done'},
      {t:'Rider assigned', time:'Sep 24, 3:44 PM', state:'done'},
      {t:'Order accepted', time:'Sep 24, 3:47 PM', state:'done'},
      {t:'Order picked up', time:'Sep 24, 4:02 PM', state:'done'},
      {t:'Delivery started', time:'Sep 24, 4:05 PM', state:'done'},
      {t:'Delivery completed', time:'Sep 24, 4:38 PM', state:'done'}
    ]
  },
  {
    id:'ORD-1038', customer:'Hina Yousaf', date:'2026-09-24', status:'picked', eta:'40 minutes',
    pickup:'Mardan', delivery:'Takht Bhai', riderPos:'Mardan',
    rider:{name:'Bilal Khan', initials:'BK', phone:'+92 333 1122334', vehicle:'Honda CD 70 · Bike · PK-4521'},
    timeline:[
      {t:'New order created', time:'Sep 24, 11:05 AM', state:'done'},
      {t:'Rider assigned', time:'Sep 24, 11:09 AM', state:'done'},
      {t:'Order accepted', time:'Sep 24, 11:12 AM', state:'done'},
      {t:'Order picked up', time:'Sep 24, 11:30 AM', state:'current'},
      {t:'Delivery started', time:'—', state:''},
      {t:'Delivery completed', time:'—', state:''}
    ]
  }
];

const notifications = [
  {text:'ORD-1041 — rider Junaid Iqbal assigned', time:'2 min ago'},
  {text:'ORD-1042 — delivery started from Chakdara', time:'18 min ago'},
  {text:'ORD-1038 — order picked up in Mardan', time:'1 hr ago'}
];

let activeId = orders[0].id;

function initFilters(){
  const dateSel = document.getElementById('dateFilter');
  [...new Set(orders.map(o=>o.date))].sort().reverse().forEach(d=>{
    const opt = document.createElement('option');
    opt.value = d; opt.textContent = d;
    dateSel.appendChild(opt);
  });
}

function renderList(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const st = document.getElementById('statusFilter').value;
  const dt = document.getElementById('dateFilter').value;
  const listEl = document.getElementById('orderList');
  const filtered = orders.filter(o=>{
    const matchesQ = !q || o.id.toLowerCase().includes(q) || o.customer.toLowerCase().includes(q) || o.rider.name.toLowerCase().includes(q);
    const matchesSt = !st || o.status===st;
    const matchesDt = !dt || o.date===dt;
    return matchesQ && matchesSt && matchesDt;
  });
  listEl.innerHTML = '';
  if(!filtered.length){
    listEl.innerHTML = '<div class="empty-note">No orders match your search.</div>';
    return;
  }
  filtered.forEach(o=>{
    const meta = STATUS_META[o.status];
    const div = document.createElement('div');
    div.className = 'order-card' + (o.id===activeId?' active':'');
    div.innerHTML = `
      <div class="row1"><span class="oid">${o.id}</span><span class="pill ${meta.cls}">${meta.label}</span></div>
      <div class="cust">${o.customer} · rider ${o.rider.name}</div>
      <div class="route">${o.pickup} → ${o.delivery}</div>`;
    div.onclick = ()=>{ activeId = o.id; renderList(); renderTrack(); };
    listEl.appendChild(div);
  });
}

function routeSVG(o){
  // simple 3-point simulated route diagram
  const pts = [{x:60,y:110,label:o.pickup,color:'var(--blue)'},{x:270,y:50,label:o.riderPos,color:'var(--amber)'},{x:480,y:110,label:o.delivery,color:'var(--green)'}];
  return `
  <svg viewBox="0 0 540 170" xmlns="http://www.w3.org/2000/svg">
    <path d="M60,110 Q165,20 270,50 T480,110" fill="none" stroke="#26394F" stroke-width="3" stroke-dasharray="1 10" stroke-linecap="round"/>
    <path d="M60,110 Q165,20 270,50" fill="none" stroke="#4FC3F7" stroke-width="3" stroke-linecap="round"/>
    ${pts.map((p,i)=>`
      <circle cx="${p.x}" cy="${p.y}" r="9" fill="${p.color}"/>
      <circle cx="${p.x}" cy="${p.y}" r="9" fill="${p.color}" opacity="0.35"><animate attributeName="r" values="9;16;9" dur="2s" repeatCount="indefinite" begin="${i*0.3}s"/><animate attributeName="opacity" values="0.35;0;0.35" dur="2s" repeatCount="indefinite" begin="${i*0.3}s"/></circle>
      <text x="${p.x}" y="${p.y+30}" text-anchor="middle" fill="#E7EDF4" font-family="Inter" font-size="13" font-weight="500">${p.label}</text>
    `).join('')}
  </svg>`;
}

function renderNotifs(){
  document.getElementById('notifBadge').textContent = notifications.length;
  document.getElementById('notifList').innerHTML = notifications.map(n=>`
    <div class="notif-item"><div class="notif-dot"></div><div><div>${n.text}</div><div class="t">${n.time}</div></div></div>
  `).join('');
}

function renderTrack(){
  const o = orders.find(x=>x.id===activeId);
  const meta = STATUS_META[o.status];
  const panel = document.getElementById('trackPanel');
  panel.innerHTML = `
    <div class="track-head">
      <div>
        <h1>${o.id}</h1>
        <div class="sub">${o.customer} · placed ${o.date}</div>
      </div>
      <div class="eta-box"><div class="label">estimated delivery</div><div class="val">${o.eta}</div></div>
    </div>

    <div class="status-line">
      <span class="pill ${meta.cls}">${meta.label}</span>
      <span class="sub" style="font-size:.8rem;">${o.pickup} → ${o.delivery}</span>
    </div>

    <div class="map">
      ${routeSVG(o)}
      <div class="map-legend">
        <span><span class="leg-dot" style="background:var(--blue)"></span>Pickup · ${o.pickup}</span>
        <span><span class="leg-dot" style="background:var(--amber)"></span>Rider · ${o.riderPos}</span>
        <span><span class="leg-dot" style="background:var(--green)"></span>Delivery · ${o.delivery}</span>
      </div>
    </div>

    <div class="grid2">
      <div class="card">
        <h3>Rider</h3>
        <div class="rider">
          <div class="avatar">${o.rider.initials}</div>
          <div><div class="name">${o.rider.name}</div><div class="veh">${o.rider.vehicle}</div></div>
        </div>
        <div class="rider-detail"><span>Phone</span><span>${o.rider.phone}</span></div>
        <div class="rider-detail"><span>Status</span><span>${meta.label}</span></div>
      </div>

      <div class="card">
        <h3>Delivery timeline</h3>
        <ul class="timeline">
          ${o.timeline.map(s=>`<li class="${s.state}"><div class="tl-dot"></div><div><div class="tl-title">${s.t}</div><div class="tl-time">${s.time}</div></div></li>`).join('')}
        </ul>
      </div>
    </div>
  `;
}

document.getElementById('searchInput').addEventListener('input', renderList);
document.getElementById('statusFilter').addEventListener('change', renderList);
document.getElementById('dateFilter').addEventListener('change', renderList);
document.getElementById('bellBtn').addEventListener('click', ()=>{
  document.getElementById('notifPanel').classList.toggle('open');
});
document.addEventListener('click', (e)=>{
  const wrap = document.querySelector('.bell-wrap');
  if(!wrap.contains(e.target)) document.getElementById('notifPanel').classList.remove('open');
});

initFilters();
renderNotifs();
renderList();
renderTrack();
</script>
</body>
</html>
